<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valhalla | Panel del Especialista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d4af37; --gold-soft:#f3e5ab; --gold-deep:#8e680c;
  --bg:#080b10; --panel:rgba(22,28,36,.55); --panel-2:rgba(30,38,48,.68);
  --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.12);
  --tx:#f2f4f7; --tx2:#98a1ad; --tx3:#6b7480;
  --ok:#2ed573; --warn:#ffb020; --err:#ff6b6b;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',system-ui,sans-serif}
body{
  min-height:100vh; color:var(--tx); padding:26px 20px 60px;
  background:
    radial-gradient(ellipse 80% 45% at 50% 0%, rgba(212,175,55,.07), transparent 62%),
    linear-gradient(rgba(4,6,10,.9), rgba(4,6,10,.96)),
    url('fondo.jpg') center/cover fixed, var(--bg);
}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold),var(--gold-deep));border-radius:10px}

.wrap{max-width:820px;margin:0 auto}

/* ===== ENCABEZADO ===== */
header{
  background:var(--panel); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line); border-radius:20px; padding:26px 28px; margin-bottom:20px;
  display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
}
.ident{display:flex; align-items:center; gap:15px; min-width:0}
.crest{
  width:48px;height:48px;border-radius:13px;flex-shrink:0;
  background:linear-gradient(145deg,rgba(212,175,55,.16),rgba(212,175,55,.04));
  border:1px solid rgba(212,175,55,.32); display:grid;place-items:center;font-size:21px;
}
.ident h1{
  font-family:'Cinzel',serif; font-size:20px; letter-spacing:3.5px; font-weight:700; line-height:1.2;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.ident p{font-size:11px;letter-spacing:1.6px;color:var(--tx3);text-transform:uppercase;margin-top:3px}
.ident p b{color:var(--tx2);font-weight:600}
.btn-out{
  padding:10px 18px;border-radius:10px;border:1px solid var(--line-2);
  background:transparent;color:var(--tx2);font-size:11.5px;letter-spacing:1.2px;
  text-transform:uppercase;font-weight:500;cursor:pointer;transition:all .25s;white-space:nowrap;
}
.btn-out:hover{border-color:rgba(255,107,107,.4);color:#ff9494;background:rgba(255,107,107,.06)}

/* ===== RESUMEN ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-bottom:22px}
.stat{
  background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line);
  border-radius:15px;padding:18px 20px;
}
.stat .l{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--tx3);margin-bottom:8px}
.stat .v{font-size:24px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums;line-height:1.15}
.stat.gold{border-color:rgba(212,175,55,.28);background:rgba(212,175,55,.055)}
.stat.gold .v{color:var(--gold)}
.stat .sub{font-size:11px;color:var(--tx3);margin-top:4px}

/* ===== PESTAÑAS ===== */
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{
  padding:9px 17px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--tx3);font-size:12.5px;font-weight:500;
  cursor:pointer;transition:all .25s;
}
.tab:hover{color:var(--tx2);border-color:var(--line-2)}
.tab.on{background:rgba(212,175,55,.1);border-color:rgba(212,175,55,.34);color:var(--gold)}
.tab .n{
  display:inline-block;margin-left:7px;padding:1px 7px;border-radius:20px;
  background:rgba(255,255,255,.07);font-size:10.5px;font-variant-numeric:tabular-nums;
}

/* ===== CITAS ===== */
.card{
  background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line);
  border-radius:15px;padding:18px 20px;margin-bottom:11px;
  display:flex;align-items:center;gap:18px;transition:all .3s;
  animation:up .45s cubic-bezier(.2,.8,.2,1) backwards;
}
.card:hover{background:var(--panel-2);border-color:rgba(212,175,55,.22);transform:translateX(4px)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card:nth-child(1){animation-delay:.03s}.card:nth-child(2){animation-delay:.06s}
.card:nth-child(3){animation-delay:.09s}.card:nth-child(4){animation-delay:.12s}
.card:nth-child(5){animation-delay:.15s}

.hora{
  flex-shrink:0;min-width:70px;text-align:center;padding:11px 8px;border-radius:11px;
  background:rgba(212,175,55,.09);border:1px solid rgba(212,175,55,.24);
}
.hora .h{font-size:16px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.hora .d{font-size:10px;color:var(--tx3);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.info{flex:1;min-width:0}
.info .cli{font-size:15px;font-weight:600;margin-bottom:4px}
.info .srv{font-size:13px;color:var(--tx2)}
.info .tel{font-size:12px;color:var(--tx3);margin-top:4px}
.precio{
  flex-shrink:0;font-size:14.5px;font-weight:600;color:var(--tx2);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}

/* ===== ESTADOS ===== */
.empty{
  text-align:center;padding:52px 24px;color:var(--tx3);
  background:var(--panel);border:1px solid var(--line);border-radius:15px;
}
.empty .ico{font-size:36px;opacity:.35;display:block;margin-bottom:14px}
.empty .t{font-size:15px;color:var(--tx2);margin-bottom:5px}
.empty .s{font-size:13px}

.skel{
  background:var(--panel);border:1px solid var(--line);border-radius:15px;
  padding:18px 20px;margin-bottom:11px;display:flex;gap:18px;align-items:center;
}
.bar{
  height:13px;border-radius:7px;
  background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 75%);
  background-size:200% 100%;animation:sh 1.4s infinite;
}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="ident">
      <div class="crest">⚔️</div>
      <div>
        <h1>VALHALLA</h1>
        <p>Especialista · <b id="nombreUsuario">…</b></p>
      </div>
    </div>
    <button class="btn-out" onclick="cerrarSesion()">Cerrar sesión</button>
  </header>

  <div class="stats">
    <div class="stat gold">
      <div class="l">Citas de hoy</div>
      <div class="v" id="statHoy">—</div>
      <div class="sub" id="statHoySub">&nbsp;</div>
    </div>
    <div class="stat">
      <div class="l">Próxima cita</div>
      <div class="v" id="statProx">—</div>
      <div class="sub" id="statProxSub">&nbsp;</div>
    </div>
    <div class="stat">
      <div class="l">Esta semana</div>
      <div class="v" id="statSemana">—</div>
      <div class="sub">citas agendadas</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-f="hoy">Hoy <span class="n" id="cHoy">0</span></button>
    <button class="tab" data-f="proximas">Próximas <span class="n" id="cProx">0</span></button>
    <button class="tab" data-f="todas">Todas <span class="n" id="cTodas">0</span></button>
  </div>

  <div id="lista"></div>

</div>

<script>
// ── Sesión ────────────────────────────────────────────────
// El redirect no detiene la ejecución por sí solo: hay que cortar
// con throw, o el código de abajo sigue corriendo con user en null.
const user = JSON.parse(localStorage.getItem('user') || 'null');
if (!user || user.role !== 'employee') {
  window.location.replace('/login.html');
  throw new Error('sesión no válida');
}
document.getElementById('nombreUsuario').textContent = (user.username || '').toUpperCase();

// ── Utilidades ────────────────────────────────────────────
const money = (n) => '₡' + Math.round(Number(n) || 0).toLocaleString('es-CR').replace(/\s/g, '.');
const hoyISO = () => new Date().toLocaleDateString('sv-SE');   // YYYY-MM-DD local

function soloFecha(v) {
  if (!v) return '';
  return String(v).length > 10 ? new Date(v).toLocaleDateString('sv-SE') : String(v).slice(0, 10);
}
function diaCorto(iso) {
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? '' : d.toLocaleDateString('es-CR', { day: '2-digit', month: 'short' });
}

let citas = [];
let filtro = 'hoy';

// ── Carga ─────────────────────────────────────────────────
function esqueleto() {
  document.getElementById('lista').innerHTML = Array.from({ length: 3 }, () => `
    <div class="skel">
      <div class="bar" style="width:70px;height:44px;border-radius:11px"></div>
      <div style="flex:1"><div class="bar" style="width:45%;margin-bottom:9px"></div>
      <div class="bar" style="width:30%;height:11px"></div></div>
    </div>`).join('');
}

function vacio(icono, titulo, sub) {
  document.getElementById('lista').innerHTML =
    `<div class="empty"><span class="ico">${icono}</span>
     <div class="t">${titulo}</div><div class="s">${sub}</div></div>`;
}

async function cargar() {
  esqueleto();
  try {
    // Se piden solo las citas de este especialista: el servidor filtra por id.
    const id = user.empleado_id ?? user.id ?? '';
    const url = id ? `/api/appointments?empleado_id=${encodeURIComponent(id)}` : '/api/appointments';
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let data = await res.json();

    // Respaldo por nombre si la cuenta aún no tiene empleado_id asociado.
    if (!id) {
      const mio = (user.username || '').toLowerCase();
      data = data.filter(a => (a.barbero || '').toLowerCase() === mio);
    }

    citas = data.map(a => ({ ...a, _fecha: soloFecha(a.fecha) }))
                .sort((a, b) => (a._fecha + a.hora).localeCompare(b._fecha + b.hora));

    resumen();
    render();
  } catch (e) {
    console.error(e);
    vacio('⚠️', 'No se pudieron cargar tus citas', 'Revisá tu conexión e intentá de nuevo.');
  }
}

// ── Resumen ───────────────────────────────────────────────
function resumen() {
  const hoy = hoyISO();
  const deHoy = citas.filter(c => c._fecha === hoy);
  const ahora = new Date().toTimeString().slice(0, 5);

  const futuras = citas.filter(c => c._fecha > hoy || (c._fecha === hoy && c.hora >= ahora));
  const prox = futuras[0];

  const finSemana = new Date(); finSemana.setDate(finSemana.getDate() + 7);
  const limite = finSemana.toLocaleDateString('sv-SE');
  const semana = citas.filter(c => c._fecha >= hoy && c._fecha <= limite);

  const ingresoHoy = deHoy.reduce((s, c) => s + Number(c.precio || 0), 0);

  document.getElementById('statHoy').textContent = deHoy.length;
  document.getElementById('statHoySub').textContent = deHoy.length ? money(ingresoHoy) + ' en servicios' : 'sin citas hoy';
  document.getElementById('statProx').textContent = prox ? prox.hora : '—';
  document.getElementById('statProxSub').textContent = prox
    ? (prox._fecha === hoy ? 'hoy · ' + prox.cliente_nombre : diaCorto(prox._fecha) + ' · ' + prox.cliente_nombre)
    : 'nada agendado';
  document.getElementById('statSemana').textContent = semana.length;

  document.getElementById('cHoy').textContent = deHoy.length;
  document.getElementById('cProx').textContent = futuras.length;
  document.getElementById('cTodas').textContent = citas.length;
}

// ── Render ────────────────────────────────────────────────
function render() {
  const hoy = hoyISO();
  const ahora = new Date().toTimeString().slice(0, 5);
  let lista;

  if (filtro === 'hoy') {
    lista = citas.filter(c => c._fecha === hoy);
    if (!lista.length) return vacio('📅', 'No tenés citas hoy', 'Revisá la pestaña de próximas para ver lo que viene.');
  } else if (filtro === 'proximas') {
    lista = citas.filter(c => c._fecha > hoy || (c._fecha === hoy && c.hora >= ahora));
    if (!lista.length) return vacio('🗓', 'Sin citas próximas', 'Todavía no hay nada agendado hacia adelante.');
  } else {
    lista = citas;
    if (!lista.length) return vacio('📭', 'Sin citas registradas', 'Cuando te asignen clientes aparecerán acá.');
  }

  document.getElementById('lista').innerHTML = lista.map(c => `
    <div class="card">
      <div class="hora">
        <div class="h">${c.hora || '--:--'}</div>
        <div class="d">${c._fecha === hoy ? 'hoy' : diaCorto(c._fecha)}</div>
      </div>
      <div class="info">
        <div class="cli">${c.cliente_nombre || 'Cliente'}</div>
        <div class="srv">${c.servicio || 'Servicio no especificado'}</div>
        ${c.cliente_telefono ? `<div class="tel">${c.cliente_telefono}</div>` : ''}
      </div>
      <div class="precio">${c.precio ? money(c.precio) : ''}</div>
    </div>`).join('');
}

// ── Pestañas ──────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    filtro = t.dataset.f;
    render();
  });
});

function cerrarSesion() {
  localStorage.removeItem('user');
  window.location.replace('/login.html');
}

cargar();
</script>
</body>
</html>
