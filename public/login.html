<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valhalla | Acceso Privado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d4af37; --gold-soft:#f3e5ab; --gold-deep:#8e680c;
  --bg:#080b10; --panel:rgba(20,26,34,.72); --line:rgba(255,255,255,.07);
  --tx:#f2f4f7; --tx2:#98a1ad; --tx3:#6b7480;
  --err:#ff6b6b; --ok:#2ed573;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',system-ui,sans-serif}
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; color:var(--tx);
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(212,175,55,.09), transparent 65%),
    linear-gradient(rgba(4,6,10,.86), rgba(4,6,10,.94)),
    url('fondo.jpg') center/cover fixed,
    var(--bg);
}

.card{
  width:100%; max-width:400px;
  background:var(--panel);
  backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
  border:1px solid var(--line); border-radius:22px;
  padding:44px 36px 34px;
  box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  animation:enter .55s cubic-bezier(.2,.8,.2,1);
}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.brand{text-align:center; margin-bottom:34px}
.crest{
  width:52px; height:52px; margin:0 auto 16px; border-radius:14px;
  background:linear-gradient(145deg, rgba(212,175,55,.16), rgba(212,175,55,.04));
  border:1px solid rgba(212,175,55,.34);
  display:grid; place-items:center; font-size:23px;
}
.brand h1{
  font-family:'Cinzel',serif; font-size:26px; letter-spacing:5px; font-weight:700;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold),var(--gold-deep));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  margin-bottom:7px;
}
.brand p{font-size:10.5px; letter-spacing:2.6px; color:var(--tx3); text-transform:uppercase}

.field{margin-bottom:17px}
.field label{
  display:block; font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase;
  color:var(--tx3); margin-bottom:7px; font-weight:500;
}
.field input{
  width:100%; padding:13px 15px; border-radius:11px;
  background:rgba(0,0,0,.32); border:1px solid var(--line);
  color:var(--tx); font-size:14.5px; outline:none; transition:all .25s;
}
.field input::placeholder{color:rgba(255,255,255,.2)}
.field input:focus{
  border-color:rgba(212,175,55,.55); background:rgba(0,0,0,.46);
  box-shadow:0 0 0 3px rgba(212,175,55,.09);
}
.field input:disabled{opacity:.55; cursor:not-allowed}

.btn{
  width:100%; margin-top:26px; padding:14px; border:none; border-radius:11px;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold),var(--gold-deep));
  color:#0a0d12; font-weight:600; font-size:12.5px; letter-spacing:1.6px;
  text-transform:uppercase; cursor:pointer; transition:all .25s;
  display:flex; align-items:center; justify-content:center; gap:9px;
}
.btn:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 10px 26px rgba(212,175,55,.26); filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.6; cursor:wait}

/* Indicador de carga: el boton comunica que la peticion esta en curso,
   y queda deshabilitado para que un doble clic no envie dos veces. */
.spinner{
  width:14px; height:14px; border:2px solid rgba(10,13,18,.28);
  border-top-color:#0a0d12; border-radius:50%;
  animation:spin .7s linear infinite; display:none;
}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.loading .spinner{display:block}

.msg{
  margin-top:17px; padding:11px 14px; border-radius:9px; font-size:13px;
  line-height:1.45; text-align:center; display:none;
}
.msg.show{display:block; animation:enter .28s ease}
.msg.error{background:rgba(255,107,107,.1); border:1px solid rgba(255,107,107,.28); color:#ff9494}
.msg.ok{background:rgba(46,213,115,.1); border:1px solid rgba(46,213,115,.28); color:#6be29b}

.back{
  display:block; text-align:center; margin-top:22px; padding-top:20px;
  border-top:1px solid var(--line);
  color:var(--tx3); font-size:12px; text-decoration:none; transition:color .2s;
}
.back:hover{color:var(--tx2)}

/* Acceso de demostración */
.demo{margin-top:24px; padding-top:20px; border-top:1px solid var(--line)}
.demo-t{
  font-size:10px; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--tx3); text-align:center; margin-bottom:12px;
}
.demo-btns{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.demo-b{
  display:flex; flex-direction:column; gap:3px; align-items:center;
  padding:11px 8px; border-radius:10px; cursor:pointer; font-family:inherit;
  background:rgba(255,255,255,.035); border:1px solid var(--line);
  transition:all .25s;
}
.demo-b b{font-size:12.5px; color:var(--tx2); font-weight:600}
.demo-b span{font-size:10.5px; color:var(--tx3)}
.demo-b:hover{
  border-color:rgba(212,175,55,.4); background:rgba(212,175,55,.07);
}
.demo-b:hover b{color:var(--gold)}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="crest">⚔️</div>
    <h1>VALHALLA</h1>
    <p>Control de acceso</p>
  </div>

  <form id="loginForm" autocomplete="on" novalidate>
    <div class="field">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" placeholder="Tu identificación"
             autocomplete="username" required autofocus>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••"
             autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn" id="btnLogin">
      <span class="spinner"></span>
      <span id="btnText">Entrar</span>
    </button>
  </form>

  <div id="msg" class="msg"></div>

  <!-- Acceso de demostración: este sistema forma parte de un portafolio,
       así que las credenciales se muestran para que cualquiera pueda
       recorrerlo sin pedir permiso. -->
  <div class="demo">
    <div class="demo-t">Acceso de demostración</div>
    <div class="demo-btns">
      <button type="button" class="demo-b" onclick="usarDemo('demo')">
        <b>Dueño</b><span>panel completo</span>
      </button>
      <button type="button" class="demo-b" onclick="usarDemo('empleado')">
        <b>Especialista</b><span>su agenda</span>
      </button>
    </div>
  </div>

  <a href="index.html" class="back">← Volver al sitio público</a>
</div>

<script>
const form  = document.getElementById('loginForm');
const btn   = document.getElementById('btnLogin');
const txt   = document.getElementById('btnText');
const msgEl = document.getElementById('msg');
const campos = [document.getElementById('username'), document.getElementById('password')];

function mensaje(texto, tipo) {
  msgEl.className = 'msg show ' + tipo;
  msgEl.textContent = texto;
}
function limpiarMensaje() {
  msgEl.className = 'msg';
}
function cargando(activo) {
  btn.disabled = activo;
  btn.classList.toggle('loading', activo);
  txt.textContent = activo ? 'Verificando…' : 'Entrar';
  campos.forEach(c => c.disabled = activo);
}

// El submit del formulario cubre el clic y la tecla Enter con un solo camino,
// en vez de un listener de teclado global que disparaba en cualquier parte.
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  limpiarMensaje();

  const username = campos[0].value.trim();
  const password = campos[1].value;

  if (!username || !password) {
    mensaje('Completá usuario y contraseña.', 'error');
    (username ? campos[1] : campos[0]).focus();
    return;
  }

  cargando(true);
  try {
    const res  = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      mensaje(data.message || 'Usuario o contraseña incorrectos.', 'error');
      campos[1].value = '';
      campos[1].focus();
      cargando(false);
      return;
    }

    // Se valida la forma de la respuesta antes de guardar sesión y redirigir:
    // antes se guardaba lo que llegara y se leía data.user.role a ciegas.
    const user = data && data.user;
    if (!user || !user.role) {
      mensaje('Respuesta inesperada del servidor. Intentá de nuevo.', 'error');
      cargando(false);
      return;
    }

    localStorage.setItem('user', JSON.stringify(user));
    mensaje('Acceso concedido. Entrando…', 'ok');
    txt.textContent = 'Entrando…';

    const destino = user.role === 'admin'    ? '/admin.html'
                  : user.role === 'employee' ? '/employee.html'
                  : '/index.html';
    setTimeout(() => { window.location.href = destino; }, 550);

  } catch (err) {
    console.error(err);
    mensaje('No se pudo conectar con el servidor. Revisá tu conexión.', 'error');
    cargando(false);
  }
});

campos.forEach(c => c.addEventListener('input', limpiarMensaje));

// Rellena y envía con una de las cuentas de demostración. Ambas comparten
// contraseña porque son públicas a propósito.
function usarDemo(usuario) {
  campos[0].value = usuario;
  campos[1].value = 'demo1234';
  limpiarMensaje();
  form.requestSubmit();
}
</script>
</body>
</html>
